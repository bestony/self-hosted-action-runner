apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: default
  labels:
    app: github-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      containers:
        - name: runner
          image: ghcr.io/your-org/github-runner:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: github-runner-config
            - secretRef:
                name: github-runner-secret
          volumeMounts:
            - name: runner-data
              mountPath: /runner
            - name: docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: github-runner-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
