apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-repo-b-config
data:
  RUNNER_URL: "https://github.com/my-org/repo-b"
  RUNNER_NAME_PREFIX: "repo-b-"
  RUNNER_LABELS: "self-hosted,linux,docker,k8s"
  RUNNER_WORKDIR: "/tmp/github-runner/work-repo-b"
  ACTIONS_RESULTS_URL: "http://cache-server.github-runners.svc.cluster.local:3000/"
---
apiVersion: v1
kind: Secret
metadata:
  name: runner-repo-b-secret
type: Opaque
stringData:
  RUNNER_TOKEN: "REPLACE_WITH_REPO_B_TOKEN"
---
apiVersion: v1
kind: Service
metadata:
  name: runner-repo-b
  labels:
    app: runner-repo-b
spec:
  clusterIP: None
  selector:
    app: runner-repo-b
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runner-repo-b
  labels:
    app: runner-repo-b
spec:
  serviceName: "runner-repo-b"
  replicas: 1
  selector:
    matchLabels:
      app: runner-repo-b
  template:
    metadata:
      labels:
        app: runner-repo-b
    spec:
      containers:
        - name: runner
          image: ghcr.io/bestony/self-hosted-action-runner:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: runner-repo-b-config
            - secretRef:
                name: runner-repo-b-secret
          volumeMounts:
            - name: runner-data
              mountPath: /runner
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: runner-work
              mountPath: /tmp/github-runner/work-repo-b
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: runner-work
          hostPath:
            path: /tmp/github-runner/work-repo-b
            type: DirectoryOrCreate
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
