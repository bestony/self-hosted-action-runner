name: Update Docker Hub Description

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/workflows/dockerhub-description.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-description:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Docker Hub credentials
        id: dockerhub-check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_REPOSITORY" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "dockerhub_repository=$DOCKERHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials and repository configured."
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub description sync skipped (requires DOCKERHUB_USERNAME & DOCKERHUB_TOKEN secrets, and vars.DOCKERHUB_REPOSITORY)."
          fi

      - name: Synchronize README to Docker Hub
        if: steps.dockerhub-check.outputs.has_dockerhub == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.dockerhub-check.outputs.dockerhub_repository }}
          short-description: 'Self-hosted GitHub Actions runner with DooD and Actions Cache Server support'
          readme-filepath: ./README.md
