name: Build and Publish Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'Specific actions/runner version to build (e.g. 2.337.0)'
        required: false
        default: ''
      push:
        description: 'Push image to registries'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine and validate runner version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.runner_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Lowercase GHCR repository name
          GHCR_IMAGE="ghcr.io/$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"

          # Query latest stable upstream release
          LATEST_STABLE=$(gh api repos/actions/runner/releases --jq '.[] | select(.prerelease == false and .draft == false) | .tag_name' | head -n 1 | sed 's/^v//')
          echo "Latest stable upstream runner version: $LATEST_STABLE"

          # Determine target version
          if [ -n "$INPUT_VERSION" ]; then
            CLEAN_VERSION="${INPUT_VERSION#v}"
            if ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Version '$INPUT_VERSION' does not match semantic version regex ^[0-9]+\.[0-9]+\.[0-9]+$" >&2
              exit 1
            fi

            echo "Validating input version $CLEAN_VERSION against upstream releases..."
            IS_VALID=$(gh api "repos/actions/runner/releases/tags/v${CLEAN_VERSION}" --jq '.tag_name != null and .draft == false and .prerelease == false' 2>/dev/null || echo "false")
            if [ "$IS_VALID" != "true" ]; then
              echo "Error: Release v${CLEAN_VERSION} does not exist as a stable release in actions/runner!" >&2
              exit 1
            fi
            TARGET_VERSION="$CLEAN_VERSION"
          elif [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == v* ]]; then
            TARGET_VERSION="${REF_NAME#v}"
          else
            # Default to Dockerfile ARG RUNNER_VERSION
            DEFAULT_VERSION=$(grep -E '^ARG RUNNER_VERSION=' Dockerfile | head -n 1 | cut -d= -f2 | tr -d ' "')
            TARGET_VERSION="${DEFAULT_VERSION:-$LATEST_STABLE}"
          fi

          echo "Target runner version: $TARGET_VERSION"
          echo "runner_version=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${TARGET_VERSION}" >> "$GITHUB_OUTPUT"

          # Extract official package SHA-256 hashes from upstream release body
          echo "Fetching upstream release body for v${TARGET_VERSION} to extract package checksums..."
          RELEASE_BODY=$(gh api "repos/actions/runner/releases/tags/v${TARGET_VERSION}" --jq .body)
          
          SHA_AMD64=$(echo "$RELEASE_BODY" | sed -n 's/.*<!-- BEGIN SHA linux-x64 -->\([a-fA-F0-9]\{64\}\)<!-- END SHA linux-x64 -->.*/\1/p')
          SHA_ARM64=$(echo "$RELEASE_BODY" | sed -n 's/.*<!-- BEGIN SHA linux-arm64 -->\([a-fA-F0-9]\{64\}\)<!-- END SHA linux-arm64 -->.*/\1/p')

          if ! [[ "$SHA_AMD64" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Error: Failed to extract valid 64-character SHA-256 for linux-x64 from release notes!" >&2
            exit 1
          fi
          if ! [[ "$SHA_ARM64" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Error: Failed to extract valid 64-character SHA-256 for linux-arm64 from release notes!" >&2
            exit 1
          fi

          echo "Extracted SHA256 (linux-x64): ${SHA_AMD64}"
          echo "Extracted SHA256 (linux-arm64): ${SHA_ARM64}"
          echo "sha256_amd64=${SHA_AMD64}" >> "$GITHUB_OUTPUT"
          echo "sha256_arm64=${SHA_ARM64}" >> "$GITHUB_OUTPUT"

          if [ "$TARGET_VERSION" = "$LATEST_STABLE" ]; then
            echo "Target version matches latest stable release. Enabling latest tag."
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "Target version ($TARGET_VERSION) differs from latest stable ($LATEST_STABLE). Disabling latest tag."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub-check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_REPOSITORY" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "dockerhub_repository=$DOCKERHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials and repository configured. Will push to Docker Hub: $DOCKERHUB_REPOSITORY"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub publishing is skipped (requires DOCKERHUB_USERNAME & DOCKERHUB_TOKEN secrets, and vars.DOCKERHUB_REPOSITORY)."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub-check.outputs.has_dockerhub == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.version.outputs.ghcr_image }}
            ${{ steps.dockerhub-check.outputs.has_dockerhub == 'true' && format('docker.io/{0}', steps.dockerhub-check.outputs.dockerhub_repository) || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag_name }}
            type=semver,pattern={{raw}},value=${{ steps.version.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag_name }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest == 'true' }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUNNER_VERSION=${{ steps.version.outputs.runner_version }}
            RUNNER_SHA256_AMD64=${{ steps.version.outputs.sha256_amd64 }}
            RUNNER_SHA256_ARM64=${{ steps.version.outputs.sha256_arm64 }}
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
